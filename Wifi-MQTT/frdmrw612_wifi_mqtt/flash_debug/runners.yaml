# Available runners configured by board.cmake.
runners:
- linkserver
- jlink

# Default flash runner if --runner is not given.
flash-runner: linkserver

# Default debug runner if --runner is not given.
debug-runner: linkserver

# Common runner configuration values.
config:
  board_dir: C:/Users/josem/Documents/mcuxsdk/mcuxsdk/mcuxsdk/examples/_boards/frdmrw612
  # Build outputs:
  bin_file: frdmrw612_wifi_mqtt.bin
  elf_file: frdmrw612_wifi_mqtt.elf
  hex_file: frdmrw612_wifi_mqtt.hex
  # Host tools:
  gdb: C:/Users/josem/.mcuxpressotools/arm-gnu-toolchain-14.2.rel1-mingw-w64-x86_64-arm-none-eabi/bin/arm-none-eabi-gdb.exe

# Runner specific arguments
args:
  linkserver:
    - --dt-flash=y
    - --device=RW612:FRDM-RW612
  jlink:
    - --dt-flash=y
    - --device=RW612
