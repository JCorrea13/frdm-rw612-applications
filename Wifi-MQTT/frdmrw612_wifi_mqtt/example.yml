wifi_mqtt:
  boards:
    frdmrw612:
    - -armgcc@debug
    - -armgcc@release
    - -iar@debug
    - -iar@release
    - -mdk@debug
    - -mdk@release
  contents:
    document:
      brief: The wifi_mqtt demo application demonstrates an MQTT client on the lwIP
        TCP/IP stack with FreeRTOS over wi-fi. The board connects to the broker and
        sends few messages.
      category: wifi_examples
      example_readme:
      - examples/wifi_examples/wifi_mqtt/readme.md
      - ${board_root}/${board}/wifi_examples/common/wifi_examples_readme.md
      - ${board_root}/${board}/wifi_examples/readme_modules.md
      - ${board_root}/${board}/examples_shared_readme.md
      name: wifi_mqtt${core_id_suffix_name}
    meta_path: examples/wifi_examples/wifi_mqtt
    project-root-path: boards/${board}/wifi_examples/wifi_mqtt/${multicore_foldername}
  section-type: freestanding_application
